name: Deploy Portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        run: |
          echo "IMAGE_NAME=$(echo ghcr.io/${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.TAG }}
            ${{ env.IMAGE_NAME }}:prod

      - name: Render docker-stack.yml
        run: |
          export IMAGE_NAME="${{ env.IMAGE_NAME }}"
          export TAG="${{ env.TAG }}"
          envsubst < deployments/templates/portfolio-prod.yml > docker-stack.yml

      - name: Ensure app directory exists on VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.OVH_VPS_HOST }}
          username: ${{ secrets.OVH_VPS_USER }}
          key: ${{ secrets.OVH_VPS_SSH_KEY }}
          script: |
            mkdir -p /home/${{ secrets.OVH_VPS_USER }}/apps/portfolio

      - name: Copy stack to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OVH_VPS_HOST }}
          username: ${{ secrets.OVH_VPS_USER }}
          key: ${{ secrets.OVH_VPS_SSH_KEY }}
          source: "docker-stack.yml"
          target: "/home/${{ secrets.OVH_VPS_USER }}/apps/portfolio"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.OVH_VPS_HOST }}
          username: ${{ secrets.OVH_VPS_USER }}
          key: ${{ secrets.OVH_VPS_SSH_KEY }}
          script: |
            cd /home/${{ secrets.OVH_VPS_USER }}/apps/portfolio
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker stack deploy -c docker-stack.yml portfolio --with-registry-auth

      - name: Clean up Docker on VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.OVH_VPS_HOST }}
          username: ${{ secrets.OVH_VPS_USER }}
          key: ${{ secrets.OVH_VPS_SSH_KEY }}
          script: |
            echo "🧹 Cleaning up unused Docker data..."
            docker system prune -af --volumes
